<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0c0d0f"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#c9a84c" stroke-width="0.6" opacity="0.4"/>

  <!-- Fork — left side -->
  <!-- Three tines -->
  <rect x="8"   y="5" width="1.3" height="6.5" rx="0.65" fill="#c9a84c"/>
  <rect x="10.4" y="5" width="1.3" height="6.5" rx="0.65" fill="#c9a84c"/>
  <rect x="12.8" y="5" width="1.3" height="6.5" rx="0.65" fill="#c9a84c"/>
  <!-- Curved neck -->
  <path d="M8.65 11.5 Q8.65 14.5 11.05 14.5 Q13.45 14.5 13.45 11.5" stroke="#c9a84c" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Handle -->
  <rect x="10.4" y="14" width="1.3" height="13" rx="0.65" fill="#c9a84c"/>

  <!-- Knife — right side -->
  <!-- Blade (tapers at tip) -->
  <path d="M19.5 5 Q21.5 5 21.5 13 L19.5 13 Z" fill="#c9a84c"/>
  <!-- Handle -->
  <rect x="19.5" y="13" width="2" height="14" rx="1" fill="#c9a84c"/>
</svg>
