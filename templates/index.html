<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Bookings</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        header { position: relative; }
        .admin-btn {
            position: absolute;
            top: 50%;
            right: 2rem;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .admin-btn:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>
    <header>
        <h1>Find Your Table</h1>
        <a href="/admin" class="admin-btn">Admin Login</a>
    </header>
    <div id="app" class="container">
        <div id="restaurant-grid" class="grid"></div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">Book a Table</h2>
            <div id="slots-container"></div>
            <form id="booking-form" class="hidden">
                <input type="hidden" id="selected-restaurant-id">
                <input type="hidden" id="selected-time">
                <input type="text" id="cust-name" placeholder="Full Name" required>
                <input type="tel" id="cust-phone" placeholder="Phone Number" required>
                <button type="submit" class="btn">Confirm Booking</button>
            </form>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
